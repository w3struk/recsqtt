# Heap is proportional, not absolute. A fixed -Xmx8G means two different builds:
# on an 8 GB WSL VM it lets the daemon grow into swap, and on any machine with a
# ~/.gradle/gradle.properties of its own that value wins over this file (on Gradle 9
# the user-home file overrides the project one), so the setting silently changes.
# 50% of RAM is 8 GB on a 16 GB CI runner and 4 GB on an 8 GB WSL VM, and the same
# policy applies in both places.
org.gradle.jvmargs=-XX:MaxRAMPercentage=50 -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m --enable-native-access=ALL-UNNAMED
# Same policy for the Kotlin compiler daemon: a small fixed ceiling instead of the
# heap inherited from the Gradle daemon (~85% of it, i.e. 3.5 GB here, 6.8 GB on a
# 16 GB runner). An explicit -Xmx is needed: the Kotlin launcher passes its own -Xmx
# first and it wins over -XX:MaxRAMPercentage.
kotlin.daemon.jvmargs=-Xmx2g
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.vfs.watch=true
kotlin.caching.enabled=true
