<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" id="themeColorMeta" content="#f8fafc">
    <link rel="icon" type="image/svg+xml" href="/pwa-icon.svg">
    <link rel="apple-touch-icon" href="/pwa-icon.svg">
    <meta property="og:title" content="reCSQTT">
    <meta property="og:type" content="website">
    <meta property="og:image" content="/pwa-icon.svg">
    <title>Подписка: __CLIENT_NAME__</title>
    <script src="/qrcode.min.js"></script>
    <style>
        /*__THEME_TOKENS__*/
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        dialog#qrDlg {
            display: block;
            position: static;
            background: var(--surface);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
            max-width: 440px;
            width: min(440px, calc(100% - 24px));
            text-align: center;
        }
        .dlg-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-btn:hover {
            color: var(--text-main);
            background: var(--surface-hover);
        }
        .qr-box {
            background: #ffffff;
            padding: 12px;
            border-radius: 12px;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 260px;
            height: 260px;
            margin: 0 auto;
        }
        .qr-box svg {
            width: 100%;
            height: 100%;
            display: block;
        }
        .btn {
            font-family: inherit;
            cursor: pointer;
            transition: all 0.15s ease;
            outline: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }
        .btn-primary {
            background: var(--primary);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        .btn-primary:hover {
            background: var(--primary-hover);
        }
        .btn-ghost {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 8px;
        }
        .btn-ghost:hover {
            background: var(--surface-hover);
        }
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transition: transform 0.25s ease, opacity 0.25s ease;
            pointer-events: none;
            z-index: 1000;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .theme-toggle {
            position: fixed; top: 16px; right: 16px; z-index: 20;
            width: 36px; height: 36px; margin: 0; padding: 0;
            display: inline-flex; align-items: center; justify-content: center;
            background: var(--surface); color: var(--text-muted);
            border: 1px solid var(--border); border-radius: 10px;
            cursor: pointer; transition: color 0.2s, border-color 0.2s;
        }
        .theme-toggle:hover { color: var(--text-main); border-color: var(--text-muted); }
    </style>
    <script>
        function syncThemeColorMeta() {
            const meta = document.getElementById('themeColorMeta');
            if (!meta) return;
            meta.setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--bg-color').trim());
        }
        if (localStorage.getItem('csqtt-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        syncThemeColorMeta();
    </script>
</head>
<body>
    <button class="theme-toggle" type="button" onclick="toggleTheme()" title="Сменить тему" aria-label="Сменить тему">
        <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
    <dialog id="qrDlg" style="max-width: 440px; width: min(440px, calc(100% - 24px)); text-align: center;" open="">
        <div class="dlg-header" style="justify-content: center;">
            <div style="display: flex; align-items: center; gap: 8px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" style="stroke:var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                    <path d="M7 7h.01M17 7h.01M7 17h.01M17 17h.01"></path>
                </svg>
                <h2 id="qrDlgTitle" style="font-size: 18px; margin: 0;">Подписка: __CLIENT_NAME__</h2>
            </div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px; margin: 16px 0;">
            <div id="qrCodeContainer" class="qr-box"></div>
            <div style="width: 100%; display: flex; gap: 8px; align-items: center;">
                <input id="qrDlgLink" readonly="" value="__CSQTT_LINK__" style="flex: 1; height: 42px; font-size: 12px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; padding: 0 10px; background: var(--surface-hover); color: var(--text-muted); border-radius: 8px; border: 1px solid var(--border);" onclick="this.select()">
                <button class="btn btn-ghost" id="qrDlgCopyBtn" onclick="copyQrDlgLink(this)" style="height: 42px; width: 44px; padding: 0; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: #27272a; border: 1px solid #3f3f46; color: #ffffff; border-radius: 8px;" title="Копировать ссылку">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </button>
            </div>
        </div>
        <div class="dlg-actions" style="justify-content: center; display: flex; margin-top: 16px;">
            <a id="qrDlgConnectBtn" href="__CSQTT_LINK__" class="btn btn-primary" style="width: 100%; height: 42px; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 14px; border-radius: 8px;">Подключить в приложении reCSQTT</a>
        </div>
    </dialog>

    <div id="toast" class="toast"></div>

    <script>
        const MOON_ICON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
        const SUN_ICON = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
        function updateThemeIcon() {
            const icon = document.getElementById('themeIcon');
            if (!icon) return;
            icon.innerHTML = document.documentElement.getAttribute('data-theme') === 'dark' ? SUN_ICON : MOON_ICON;
        }
        function toggleTheme() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('csqtt-theme', isDark ? 'light' : 'dark');
            updateThemeIcon();
            syncThemeColorMeta();
        }
        updateThemeIcon();
                function showToast(msg) {
            const t = document.getElementById('toast');
            if (!t) return;
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => { t.classList.remove('show'); }, 2000);
        }
        async function copyToClipboard(text) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                try {
                    await navigator.clipboard.writeText(text);
                    return true;
                } catch (e) {}
            }
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'absolute';
                ta.style.left = '-9999px';
                ta.style.top = '0';
                ta.setAttribute('readonly', '');
                document.body.appendChild(ta);
                ta.select();
                ta.setSelectionRange(0, 99999);
                const success = document.execCommand('copy');
                document.body.removeChild(ta);
                return success;
            } catch (e) {
                return false;
            }
        }
        async function copyQrDlgLink(btn) {
            const link = document.getElementById('qrDlgLink')?.value || '';
            if (!link) return;
            if (await copyToClipboard(link)) {
                if (btn) {
                    btn.style.color = 'var(--primary)';
                    btn.style.borderColor = 'var(--primary)';
                    setTimeout(() => { btn.style.color = ''; btn.style.borderColor = ''; }, 1500);
                }
                showToast("Ссылка скопирована");
            } else {
                showToast("Не удалось скопировать");
            }
        }
        (function initQr() {
            const link = document.getElementById('qrDlgLink')?.value || '';
            if (!link) return;
            try {
                const qr = qrcode(0, 'L');
                qr.addData(link);
                qr.make();
                const svg = qr.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
                document.getElementById('qrCodeContainer').innerHTML = svg;
            } catch (e) {
                document.getElementById('qrCodeContainer').innerHTML = '<div style="color:var(--danger);padding:16px;">Ошибка генерации QR</div>';
            }
        })();
    </script>
</body>
</html>
